<!doctype html>
<html lang="en" data-theme="gftb" data-mode="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- TODO(jess): description wording. The vehicle adjective was stripped
		     because the bus is parked (salvaged from restoration PR-5; full
		     context in +layout.svelte); this comment ships in the served head,
		     so the stripped word is not quoted here. Must stay byte-identical
		     with `description` in src/routes/+layout.svelte;
		     e2e/acceptance-copy-deslop.spec.ts enforces the parity. -->
		<meta name="description" content="A community-run tool library taking shape in Lewiston–Auburn, Maine." />
		<!-- Browser chrome uses primary-700 and surface-950 literals. D01 follows the OS
		     media query for this tint even when a visitor overrides data-mode on the
		     page. -->
		<meta name="theme-color" content="#564682" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#28222b" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<script>
			// The D02 pre-paint script comes from the demo app.html:8-33. Resolve color-mode
			// and theme from localStorage before Svelte mounts. Stored preferences win. For
			// `system`, matchMedia supplies the mode. Without JavaScript the static
			// data-mode="light" remains.
			(function () {
				// CSS uses html.js to reserve space for the work sessions band before the
				// script mounts it.
				document.documentElement.classList.add('js');
				try {
					var stored = localStorage.getItem('color-mode');
					var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var mode = stored === 'light' || stored === 'dark' ? stored : prefers ? 'dark' : 'light';
					document.documentElement.setAttribute('data-mode', mode);
					document.documentElement.style.colorScheme = mode;
					var theme = localStorage.getItem('skeleton-theme');
					if (theme) {
						document.documentElement.setAttribute('data-theme', theme);
					}
					// D04 arms the hidden reveal state before first paint only when motion is
					// allowed. Reduced-motion and scriptless visitors see the resting state.
					var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (!reduceMotion) {
						document.documentElement.classList.add('motion-safe-ready');
						// Fail-open: if the app never hydrates (bundle load fails),
						// un-hide reveal content and drop the home intro veil so a
						// broken enhancement layer cannot strand either.
						// +layout.svelte cancels this on mount; the intro controller
						// then owns its own class.
						window.__gftbRevealFailsafe = setTimeout(function () {
							document.documentElement.classList.remove('motion-safe-ready');
							document.documentElement.classList.remove('intro-armed');
						}, 3000);
						// The 2026-09-10 ruling arms the home intro before paint on a full
						// load without a fragment or <html data-intro-off>. The veil covers
						// the page at its top and CSS hides it at the end. Input disarms it
						// before hydration. src/lib/intro takes over on mount.
						var forcedColors = window.matchMedia && window.matchMedia('(forced-colors: active)').matches;
						if (
							!forcedColors &&
							location.pathname === '/' &&
							location.hash === '' &&
							!window.__gftbIntroOff &&
							!document.documentElement.hasAttribute('data-intro-off')
						) {
							document.documentElement.classList.add('intro-armed');
							var disarmIntro = function () {
								document.documentElement.classList.remove('intro-armed');
							};
							['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(function (type) {
								window.addEventListener(type, disarmIntro, { capture: true, passive: true, once: true });
							});
						}
					}
				} catch (e) {
					// Keep the defaults if localStorage is unavailable.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
