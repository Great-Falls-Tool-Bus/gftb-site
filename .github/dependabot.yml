version: 2
# Under R574 and TIN-7477, dependencies enter through the Bazel module graph.
# Package updates require a change to MODULE.bazel and MODULE.bazel.lock.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
