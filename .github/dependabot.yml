version: 2
# No npm ecosystem (R574, TIN-7477): dependencies enter only through the
# Bazel module graph, so a package bump is a deliberate MODULE.bazel and
# MODULE.bazel.lock change, never a lockfile pull request from this bot.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
