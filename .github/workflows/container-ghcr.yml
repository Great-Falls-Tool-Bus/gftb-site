name: Publish candidate OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA selected for this candidate
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/container-ghcr.yml'
      - 'BUILD.bazel'
      - 'Justfile'
      - 'flake.nix'
      - 'flake.lock'

concurrency:
  group: candidate-oci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify-carrier:
    name: Verify exact source carrier
    if: github.event_name == 'pull_request'
    runs-on: tinyland-nix
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

  publish:
    name: Build + push immutable static candidate
    if: github.event_name != 'pull_request'
    runs-on: tinyland-nix
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: overlay
          persist-credentials: false
      - name: Bind attended dispatch to the exact selected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
      - name: Build and publish exact-SHA candidate
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_COMMIT_REF: ${{ github.ref_name }}
        run: cd overlay && nix develop . -c just container-image-publish
