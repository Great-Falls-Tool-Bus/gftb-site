name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TIN-4251: the application repository declares two finite Bazel actions. The
# immutable ci-templates edge submits each action; it does not select a
# provider, endpoint, credential, execution pool, or repository-specific
# runner. The adopting organization supplies the generic gf-v4-dispatch edge.
jobs:
  validate:
    uses: xoxd-ai/ci-templates/.github/workflows/spoke-ci-v4.yml@c732248e379e276d9d98b601519c161a03bffe09 # main 2026-09-22, fork_owner_allowlist
    with:
      # GF v4 fork pilot: admit pull requests from the operator fork only; a
      # fork run gets the same read-only token and no secrets.
      fork_owner_allowlist: Jesssullivan
      action_name: validate

  site-build:
    uses: xoxd-ai/ci-templates/.github/workflows/spoke-ci-v4.yml@c732248e379e276d9d98b601519c161a03bffe09 # main 2026-09-22, fork_owner_allowlist
    with:
      # GF v4 fork pilot: admit pull requests from the operator fork only; a
      # fork run gets the same read-only token and no secrets.
      fork_owner_allowlist: Jesssullivan
      action_name: site-build
