name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TIN-4251: this repository declares finite Bazel actions; it does not choose
# runners, providers, endpoints, credentials, instances, or execution pools.
# ci-templates owns the thin GitHub-to-GF dispatcher. This source pin is the
# released v4 caller from tinyland-inc/ci-templates#157. The consumer carrier
# remains Draft until its overlay is admitted and the v4 runtime is proved.
jobs:
  validate:
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-ci-v4.yml@7bed869a977485074621ef464723a43b55ee3502
    with:
      action_name: validate

  site-build:
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-ci-v4.yml@7bed869a977485074621ef464723a43b55ee3502
    with:
      action_name: site-build
