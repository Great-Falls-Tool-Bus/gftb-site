name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-ci.yml@v2.12.2
    with:
      node_version: '22'
      pnpm_version: '10.13.1'
      flywheel_config: flywheel
      cache_backed: true
      playwright_enabled: true
      lanes_path: .github/lanes.json
      default_runner_class: tinyland-nix
      heavy_runner_class: tinyland-nix
      kvm_runner_class: tinyland-nix
    secrets: inherit

  merge-gate:
    name: merge-gate
    if: always()
    needs: [ci]
    # TIN-3914: no GitHub-hosted runners in this org. `tinyland-nix` is served
    # here by the `great-falls-tool-bus-nix` ARC scale set; this repository is
    # on the `great-falls-tool-bus-infra` runner-group roster (TIN-3902).
    runs-on: tinyland-nix
    timeout-minutes: 5
    steps:
      - name: Require complete reusable CI
        env:
          REUSABLE_CI_RESULT: ${{ needs.ci.result }}
        run: test "$REUSABLE_CI_RESULT" = success
