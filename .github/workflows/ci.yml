name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TIN-4251: this repository declares finite Bazel actions; it does not choose
# runners, providers, endpoints, credentials, instances, or execution pools.
# ci-templates owns the thin GitHub-to-GF dispatcher. This source pin is the
# immutable schema-3 release from tinyland-inc/ci-templates#161. The consumer
# carrier remains Draft until its overlay is admitted and the v4 runtime is
# proved.
jobs:
  validate:
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-ci-v4.yml@0067a1f0e16012ea91d0602b7d185e534774cadb # v5.0.0
    with:
      action_name: validate

  site-build:
    uses: tinyland-inc/ci-templates/.github/workflows/spoke-ci-v4.yml@0067a1f0e16012ea91d0602b7d185e534774cadb # v5.0.0
    with:
      action_name: site-build

  # Transitional exact-head browser evidence. Binding/v4
  # PullRequestEnvironment/v1 replaces this whole job once the shared
  # controller can create and reap a routable exact-head environment.
  qa-look:
    name: qa-look
    if: github.event_name == 'pull_request'
    needs: [validate, site-build]
    runs-on: tinyland-nix
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact-head QA packet
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test -z "$(git status --porcelain)"
          nix develop --command just setup
          nix develop --command just qa-packet
          packet="qa-packet/${EXPECTED_HEAD_SHA}"
          test -f "${packet}/INDEX.md"
          test -f "${packet}/manifest.json"
          nix develop --command jq -e \
            '(.sha == env.EXPECTED_HEAD_SHA) and (.worktreeClean == true)' "${packet}/manifest.json"

      - name: Upload exact-head LOOK carrier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gftb-site-qa-look-${{ github.event.pull_request.head.sha }}
          path: qa-packet/${{ github.event.pull_request.head.sha }}/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  merge-gate:
    name: merge-gate
    if: always()
    needs: [validate, site-build, qa-look]
    runs-on: tinyland-nix
    timeout-minutes: 5
    steps:
      - name: Require v4 actions and exact-head LOOK carrier
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SITE_BUILD_RESULT: ${{ needs.site-build.result }}
          QA_LOOK_RESULT: ${{ needs.qa-look.result }}
        run: |
          set -euo pipefail
          test "${VALIDATE_RESULT}" = success
          test "${SITE_BUILD_RESULT}" = success
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${QA_LOOK_RESULT}" = success
          else
            test "${QA_LOOK_RESULT}" = skipped
          fi
